<div class="notifications-container">
  <h2>Notifications</h2>

  @if (notifications.length === 0) {
    <div class="empty">No notifications yet.</div>
  }

  @for (notification of notifications; track notification._id) {
    <button
      type="button"
      class="notification-card"
      [class.unread]="!notification.readAt"
      [class.clickable]="notification.link"
      (click)="open(notification)"
    >
      <div class="notif-top">
        <span class="notif-type">{{ notification.type | titlecase }}</span>
        <small>{{ (notification.createdAt || notification.sent_at) | date:'medium' }}</small>
      </div>
      <p>{{ notification.message }}</p>
      @if (notification.link) {
        <span class="notif-link">Tap to view →</span>
      }
    </button>
  }
</div>
